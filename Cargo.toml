[package]
name = "stock-prices"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Stock quote API backed by Yahoo Finance"

[lib]
name = "stock_prices"
path = "src/lib.rs"

[[bin]]
name = "stock-prices"
path = "src/main.rs"

# Vercel Function entrypoint; `vercel.json` rewrites every path to it.
[[bin]]
name = "axum"
path = "api/axum.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "cookies",
    "gzip",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
